# Release automation: release-please (manifest mode) maintains the release PR
# from Conventional Commits; merging it creates the tag and GitHub release, and
# the publish job ships to npm through Trusted Publishing (OIDC, provenance
# automatic, no token).
#
# Owned here since #90 (previously a thin caller into shared-configs, now
# deprecated). The release-please step uses the RELEASE_PLEASE_TOKEN secret (a
# fine-grained PAT: contents + pull-requests, read/write, this repo only) with
# a GITHUB_TOKEN fallback. With the PAT, the events release-please creates are
# real user events, so CI runs on release PRs (no close/reopen needed) and
# release-published workflows (sbom.yml) fire.
#
# npm Trusted Publisher setup (one-time, on npmjs.com — Package → Settings →
# Trusted Publisher):
#   Provider: GitHub Actions · Organization: Krister-Johansson
#   Repository: prisma-extension-timescaledb · Workflow filename: release-please.yml
#   Allowed actions: npm publish (mandatory for configurations created on or
#   after 2026-05-20)
name: release-please

on:
  push:
    branches: [main]
  # Manual re-publish of an existing release tag, e.g. when an auto-publish
  # failed AFTER the GitHub release was created. The tag is required and is
  # what gets checked out, so a re-publish never ships commits that landed on
  # main after the release. npm publish fails harmlessly if the version is
  # already on the registry.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to publish to npm (e.g. prisma-extension-timescaledb-v1.0.3). The checkout uses this tag, never main HEAD."
        required: true
        type: string

# Least-privilege at the top level; each job elevates only what it needs.
permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write # release commits, tags, and the GitHub release
      pull-requests: write # maintain the release PR
      issues: write # release-please labels PRs; labeling uses the issues API
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    # release-please runs on push only. A dispatch is a re-publish of an existing tag and must
    # not touch the release PR or create a release.
    if: ${{ github.event_name == 'push' }}
    steps:
      # A missing or expired PAT used to fall back to GITHUB_TOKEN, which kept the run green
      # while changing its behaviour: a release PR opened with GITHUB_TOKEN gets no CI, and a
      # release created with it fires no `release: published` event, so sbom.yml never signs
      # it. Fail here instead, so the expiry is a red run and not a silently unsigned release.
      - name: Require RELEASE_PLEASE_TOKEN
        env:
          TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::RELEASE_PLEASE_TOKEN is missing or empty. Renew the fine-grained PAT (contents + pull-requests, this repository only) and store it as a repository secret."
            exit 1
          fi
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          # Manifest mode: release-please-config.json + .release-please-manifest.json.

  publish:
    needs: release-please
    # `always()` lets this job run when release-please was skipped (a dispatch); the second
    # clause then decides. `inputs.tag` is required on dispatch, so it is never empty there.
    if: ${{ always() && (needs.release-please.outputs.release_created == 'true' || (github.event_name == 'workflow_dispatch' && inputs.tag != '')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC token for Trusted Publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Always the tagged commit: on push the tag release-please just created, on dispatch
          # the tag given as input. Checking out main HEAD here would publish whatever landed
          # after the release PR merged, and the provenance would point at a commit the tag
          # does not.
          ref: ${{ inputs.tag || needs.release-please.outputs.tag_name }}
          persist-credentials: false
      - name: Assert package.json matches the tag
        env:
          TAG: ${{ inputs.tag || needs.release-please.outputs.tag_name }}
        run: |
          WANT="prisma-extension-timescaledb-v$(node -p "require('./package.json').version")"
          if [ "$WANT" != "$TAG" ]; then
            echo "::error::package.json is $WANT but the tag is $TAG"
            exit 1
          fi
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false # never cache in release builds
      # Trusted Publishing requires npm >= 11.5.1. Recent Node 24.x bundles a
      # satisfying npm, so no self-install is needed (and none would be
      # hash-pinnable); assert the floor instead of assuming it.
      - name: Assert npm >= 11.5.1 (Trusted Publishing floor)
        run: |
          V="$(npm --version)"
          node -e "
            const need = [11, 5, 1];
            const got = process.argv[1].split('.').map(Number);
            const cmp = got[0] - need[0] || got[1] - need[1] || got[2] - need[2];
            if (cmp < 0) {
              console.error('npm ' + process.argv[1] + ' is below the Trusted Publishing floor 11.5.1');
              process.exit(1);
            }
          " "$V"
      # --ignore-scripts: dependency lifecycle scripts must not run in the job
      # holding the OIDC signing identity. The full prepublishOnly gate (build,
      # unit and type tests, attw) passes without them — verified in #91.
      - run: npm ci --ignore-scripts
      # prepublishOnly (build + unit + type tests + attw) runs as the pre-publish gate.
      - run: npm publish --access public
