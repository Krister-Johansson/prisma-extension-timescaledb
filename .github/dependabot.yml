version: 2
updates:
  # Keep the SHA-pinned GitHub Actions current — also keeps Scorecard's
  # Pinned-Dependencies green over time. Grouped into one PR/week to stay low-noise.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: ci

  # npm dependencies. Dev and runtime grouped separately; weekly + capped to stay quiet.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # TypeScript 7 breaks tsup and vitest, which consume the TypeScript 6
      # compiler API (see issue #79). Remove once the toolchain supports TS 7.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    groups:
      npm-development:
        dependency-type: development
      npm-production:
        dependency-type: production
    commit-message:
      prefix: chore
